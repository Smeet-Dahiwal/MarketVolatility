name: Deploy Lambda Code

on:
  push:
    branches:
      - Devlopmentsmeet
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  LAMBDA_FUNCTION_NAME: MarketVolatility
  ROLE_TO_ASSUME: arn:aws:iam::329599657799:role/GitHubActionsTerraformRole
  BUILD_DIR: build
  ZIP_FILE: lambda-package.zip

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials using AssumeRole
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Clean old build files
        run: |
          rm -rf "${BUILD_DIR}" "${ZIP_FILE}"
          mkdir -p "${BUILD_DIR}"

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt -t "${BUILD_DIR}"
          else
            echo "requirements.txt not found, skipping dependency installation"
          fi

      - name: Copy application files
        run: |
          shopt -s extglob
          cp -r !(build|.git|.github|venv|.venv|__pycache__) "${BUILD_DIR}/" || true

      - name: Remove unwanted files
        run: |
          find "${BUILD_DIR}" -type d -name "__pycache__" -exec rm -rf {} +
          find "${BUILD_DIR}" -type f -name "*.pyc" -delete
          find "${BUILD_DIR}" -type f -name "*.pyo" -delete

      - name: Create Lambda zip package
        run: |
          cd "${BUILD_DIR}"
          zip -r "../${ZIP_FILE}" .

      - name: Upload code to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file "fileb://${ZIP_FILE}"

      - name: Wait for Lambda code update
        run: |
          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

      - name: Test invoke Lambda
        run: |
          aws lambda invoke \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --payload '{}' \
            response.json
          cat response.json
